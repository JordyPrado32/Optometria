<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#d6c9b6"/><stop offset="1" stop-color="#9b8c77"/></linearGradient></defs><rect width="1200" height="850" fill="url(#a)"/><g transform="translate(140 90) rotate(-3 450 320)"><rect x="16" y="20" width="900" height="670" rx="5" fill="#665949" opacity=".22"/><rect width="900" height="670" rx="5" fill="#fffcf3"/><path d="M450 0V670" stroke="#dacfc0" stroke-width="3"/><g fill="#34382f" font-family="Georgia,serif"><text x="55" y="85" font-size="14" letter-spacing="3">EL ARTE DE OBSERVAR</text><text x="55" y="152" font-size="37">Los pequeños</text><text x="55" y="198" font-size="37">detalles.</text><text x="55" y="260" font-size="18">La luz atraviesa las hojas y dibuja</text><text x="55" y="294" font-size="18">nuevas formas sobre la mesa.</text><text x="55" y="348" font-size="18">Mirar despacio es descubrir</text><text x="55" y="382" font-size="18">lo que siempre estuvo cerca.</text><text x="505" y="140" font-size="21">Una pausa para leer</text><text x="505" y="195" font-size="17">El cielo está despejado.</text><text x="505" y="234" font-size="16">Los árboles se mueven suavemente.</text><text x="505" y="273" font-size="15">La ventana deja pasar la luz.</text><text x="505" y="312" font-size="14">Cada página guarda una historia.</text><text x="505" y="351" font-size="13">Los detalles pequeños requieren enfoque.</text><text x="505" y="390" font-size="12">Un momento de calma para mirar.</text><text x="55" y="625" font-size="13">12</text><text x="825" y="625" font-size="13">13</text></g></g></svg>
